<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
</head>
<body>
    <div>
        <form method="post">
            <select name="moneda" id="moneda">
                {%for rate in rates.keys()%}
                <option value="{{rate}}">{{rate}}</option>
                {%endfor%}
            </select>

            <button type="submit">
            Crear
            </button>

            {%if mensaje%}
            <div>
                {{mensaje}}! Saldo inicial: 0.00
            </div>
            {%endif%}

            <button type ="button" onclick="location.href='welcome'"> volver</button>

        </form>
    </div>
</body>
</html>
